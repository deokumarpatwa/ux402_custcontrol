# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: student18.com.sap.training.ux402.fullscreen.ux402fullscreen
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: S4D_100
          url: http://s4d.virtual:443
          client: '100'
        app:
          name: ZUX402CUSTCTR18
          description: UI lib App of student 18
          package: ZTRAIN_18
          transport: S4DK900445
        exclude:
          - /test/
